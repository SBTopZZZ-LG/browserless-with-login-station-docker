# ─────────────────────────────────────────────────────────────────────────────
# Login Station — docker-compose.prod.yml
# ─────────────────────────────────────────────────────────────────────────────
#
# Builds the login-station image locally from Dockerfile.login-station.
# Use this when you need to customize or debug the image build.
#
# For most users, the default docker-compose.yml (pre-built GHCR image) is
# simpler and faster:
#   docker compose up -d
#
# Usage with this file:
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml build login-station
#
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Login Station (KasmVNC + auth-proxy) ─────────────────────────────────
  login-station:
    # Build args for OCI image labels (used by CI when pushing to GHCR)
    build:
      context: .
      dockerfile: Dockerfile.login-station
      args:
        - BUILD_DATE=${BUILD_DATE:-unknown}
        - VCS_REF=${VCS_REF:-local}
        - GITHUB_REPO=${GITHUB_REPO:-local}
    container_name: login-station
    restart: unless-stopped

    ports:
      # KasmVNC web UI (browser you sign into)
      - "${KASMVNC_HOST_PORT:-127.0.0.1:3001}:3000"
      # Auth-proxy scrape API
      - "${AUTH_PROXY_HOST_PORT:-127.0.0.1:3100}:3100"
      # CDP WebSocket proxy — external CDP clients connect here
      - "${CDP_HOST_PORT:-127.0.0.1:9224}:9224"

    environment:
      # Linuxserver/Chromium standard vars
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - TITLE=${LOGIN_STATION_TITLE:-Browserless Login Station}
      - CHROME_CLI=--disable-gpu --window-size=${DISPLAY_WIDTH:-1920},${DISPLAY_HEIGHT:-1080} --remote-debugging-port=9222 --remote-debugging-address=0.0.0.0
      - DISPLAY_WIDTH=${DISPLAY_WIDTH:-1920}
      - DISPLAY_HEIGHT=${DISPLAY_HEIGHT:-1080}
      - DISPLAY_REFRESH=${DISPLAY_REFRESH:-60}
      - DARK_MODE=${DARK_MODE:-true}

      # Auto-restart Chrome if its process exits (e.g. CDP Browser.close,
      # last-tab close, crash). Without this the watchdog service idles and
      # a dead Chrome stays dead until container restart.
      - RESTART_APP=${RESTART_APP:-true}

      # Auth-proxy port (matches s6 service env)
      - AUTH_PROXY_PORT=3100

      # URL scheme for auth-proxy's response headers (http or https)
      - PUBLIC_URL_SCHEME=${PUBLIC_URL_SCHEME:-http}

    volumes:
      - login_station_config:/config
      - /dev/shm:/dev/shm

    networks:
      - login-station-net

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

    shm_size: 1gb
    security_opt:
      - seccomp:unconfined
    group_add:
      - "105"


  # ── Nginx reverse proxy (production only) ───────────────────────────────
  # Only started when USE_SSL=true. Start with:
  #   docker compose -f docker-compose.prod.yml --profile ssl up -d
  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    profiles:
      - ssl

    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"

    environment:
      - USE_SSL=${USE_SSL:-false}
      - LOGIN_DOMAIN=${LOGIN_DOMAIN:-login.localhost}
      - SCRAPE_DOMAIN=${SCRAPE_DOMAIN:-scrape.localhost}
      - SSL_CERT_PATH=${SSL_CERT_PATH:-}
      - SSL_KEY_PATH=${SSL_KEY_PATH:-}
      - KASMVNC_PORT=${KASMVNC_PORT:-3100}
      - AUTH_PROXY_PORT=${AUTH_PROXY_PORT:-3100}

    volumes:
      - ./nginx/nginx.conf.http:/etc/nginx/nginx.conf.http:ro
      - ./nginx/nginx.conf.https:/etc/nginx/nginx.conf.https:ro
      - ./nginx/proxy-headers.conf:/etc/nginx/proxy-headers.conf:ro
      - ./setup.sh:/setup.sh:ro
      # SSL certificates — set SSL_CERT_PATH / SSL_KEY_PATH in .env to host paths.
      # Mounted to fixed paths inside the container; nginx references those fixed paths.
      - ${SSL_CERT_PATH:-/etc/nginx/ssl/cert.pem}:/etc/nginx/ssl/cert.pem:ro
      - ${SSL_KEY_PATH:-/etc/nginx/ssl/key.pem}:/etc/nginx/ssl/key.pem:ro

    entrypoint: ["/setup.sh"]
    depends_on:
      login-station:
        condition: service_started

    networks:
      - login-station-net

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"


networks:
  # Internal bridge network — all containers communicate over this.
  # No external network dependency.
  login-station-net:
    driver: bridge


volumes:
  login_station_config:
